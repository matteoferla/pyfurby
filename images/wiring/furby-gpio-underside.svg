<text x="72" y="1410" class="label" text-anchor="start" fill="#0f172a">HARWIN M20: keep the same electrical pin assignments.</text>
<text x="72" y="1439" class="detail" text-anchor="start">No contacts or wires at GPIO8, GPIO9, GPIO11 or GPIO25. GPIO25 is reserved in software.</text>
<text x="72" y="1467" class="detail" text-anchor="start">Power OFF to rewire. All GPIO signals are 3.3 V logic; 5 V labels identify power rails only.</text>
